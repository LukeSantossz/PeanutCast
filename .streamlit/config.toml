# Tema do PeanutCast. Fundo marrom-solo escuro, como nas plataformas de
# previsão (Windy, Ventusky): o mapa e as cores do dado saltam sobre ele. A
# paleta continua a de mvp/marca-visual.md, em tons para fundo escuro. O resto
# do visual do painel está em peanutcast/interface/.
[theme]
base = "dark"
primaryColor = "#D6A26B"            # amendoim: botões e destaques
backgroundColor = "#14100C"         # solo: fundo da página
secondaryBackgroundColor = "#1C1611"  # solo mais claro: campos e painéis
textColor = "#F2EADD"               # bege: todo o texto
font = "Archivo, Calibri, sans-serif"
codeFont = "'IBM Plex Mono', Consolas, monospace"

[server]
headless = true
# Serve a pasta static/ em /app/static/. As fontes do painel saem dela, e por
# isso o app continua funcionando sem internet.
enableStaticServing = true
